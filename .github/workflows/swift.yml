name: Swift
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build App
        run: zsh ./scripts/build-app.sh

      - name: Create DMG
        run: hdiutil create -volname "简图" -srcfolder dist/简图.app -ov -format UDZO EasyView.dmg
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: EasyView.dmg
